name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler v4 requires Node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w worker

      - name: Test
        run: npm test -w worker

      # NOTE: cloudflare/wrangler-action is intentionally NOT used: it installs
      # its own Wrangler (v3) and ignores workingDirectory, so `wrangler deploy`
      # runs without wrangler.jsonc ("Missing entry-point"). npx uses the
      # repo-pinned Wrangler v4 in the correct directory instead.
      - name: Deploy Worker API
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --branch pins the deployment to the pushing branch so master lands on
      # production. Without it, CI's detached HEAD produces preview-only
      # deployments and production keeps serving stale HTML.
      - name: Deploy Pages UI
        run: npx wrangler pages deploy web --project-name site-stripper-ui --branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
